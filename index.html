<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Я люблю Лізу</title>

  <style>
    :root{
      --pink1:#ff9acb;
      --pink2:#ff5ea8;
      --pink3:#ffd1e6;
      --white: #fff;
    }

    *{ box-sizing:border-box; }

    html, body{
      height:100%;
      margin:0;
      overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    body{
      background:
        radial-gradient(900px 600px at 20% 15%, rgba(255,255,255,0.35), transparent 60%),
        radial-gradient(900px 700px at 80% 85%, rgba(255,255,255,0.25), transparent 60%),
        linear-gradient(135deg, var(--pink1), var(--pink2), var(--pink3));
    }

    /* легкий патерн сердечок на фоні */
    body::before{
      content:"";
      position:fixed;
      inset:-50px;
      background-image:
        radial-gradient(circle at 20px 20px, rgba(255,255,255,0.18) 0 6px, transparent 7px),
        radial-gradient(circle at 40px 40px, rgba(255,255,255,0.12) 0 5px, transparent 6px);
      background-size: 60px 60px;
      transform: rotate(-8deg);
      pointer-events:none;
      filter: blur(0.2px);
      z-index: 0;
    }

    .wrap{
      position:relative;
      z-index:2;
      height:100%;
      display:grid;
      place-items:center;
      padding:24px;
      text-align:center;
    }

    .card{
      padding:28px 26px;
      border-radius:28px;
      background: rgba(255,255,255,0.20);
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 18px 60px rgba(0,0,0,0.18);
      backdrop-filter: blur(10px);
      max-width: 820px;
      width: min(820px, 92vw);
    }

    h1{
      margin:0;
      color: var(--white);
      font-size: clamp(42px, 6vw, 86px);
      letter-spacing: 0.5px;
      text-shadow: 0 10px 35px rgba(0,0,0,0.25);
      line-height: 1.05;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse{
      0%,100%{ transform: scale(1); }
      50%{ transform: scale(1.02); }
    }

    .sub{
      margin: 14px 0 0;
      color: rgba(255,255,255,0.92);
      font-size: clamp(16px, 2.2vw, 20px);
    }

    .btn{
      margin-top: 18px;
      padding: 12px 18px;
      font-size: 16px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      color: #ff2f86;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 14px 40px rgba(0,0,0,0.18);
      transition: transform .12s ease, filter .2s ease;
    }
    .btn:hover{ transform: translateY(-1px) scale(1.03); }
    .btn:active{ transform: translateY(0) scale(0.99); }

    #layer{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:1;
    }

    .heart{
      position:absolute;
      left:0; top:0;
      will-change: transform, opacity;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.18));
      animation: fall linear forwards;
      user-select:none;
    }

    @keyframes fall{
      from{
        transform: translate(var(--x, 0px), -10vh) rotate(var(--r, 0deg));
        opacity: 0.95;
      }
      to{
        transform: translate(var(--x, 0px), 110vh) rotate(calc(var(--r, 0deg) + 120deg));
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div id="layer" aria-hidden="true"></div>

  <div class="wrap">
    <div class="card">
      <h1>Я люблю Лізу 💖</h1>
      <p class="sub">і це моя улюблена правда</p>
      <button class="btn" id="btn">Додати ще сердечок</button>
    </div>
  </div>

  <script>
    const layer = document.getElementById("layer");
    const btn = document.getElementById("btn");

    const emojis = ["💖","💗","💓","💘","💝","💕","❤️","🩷"];
    const rand = (a,b)=> Math.random()*(b-a)+a;

    function spawnHeart(x = rand(0, innerWidth)) {
      const el = document.createElement("div");
      el.className = "heart";
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];

      const size = rand(18, 60);
      const duration = rand(3.5, 8.0);
      const drift = rand(-120, 120);
      const rotate = rand(-40, 40);

      el.style.fontSize = size + "px";
      el.style.left = x + "px";
      el.style.setProperty("--x", drift + "px");
      el.style.setProperty("--r", rotate + "deg");
      el.style.animationDuration = duration + "s";

      layer.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }

    // постійний "дощ" сердечок по всьому сайту
    setInterval(() => spawnHeart(rand(0, innerWidth)), 180);

    // кнопка: сильніший "залп"
    btn.addEventListener("click", () => {
      for (let i = 0; i < 50; i++) {
        setTimeout(() => spawnHeart(rand(0, innerWidth)), i * 25);
      }
    });

    // клік по екрану теж додає сердечка в місці кліку
    window.addEventListener("click", (e) => {
      if (e.target === btn) return;
      for (let i = 0; i < 20; i++) {
        setTimeout(() => spawnHeart(e.clientX + rand(-80,80)), i * 18);
      }
    });
  </script>
</body>
</html>
